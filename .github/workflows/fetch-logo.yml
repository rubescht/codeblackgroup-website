name: fetch-3eyes-logo
on: { push: { paths: ['.github/workflows/fetch-logo.yml'] } }
permissions: { contents: write }
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          pip install -q pillow && mkdir -p logos/color
          curl -fsSL https://3eyes.com.au/wp-content/uploads/2020/08/3Eyes-Logo.png -o /tmp/3e.png
          python3 -c "from PIL import Image;i=Image.open('/tmp/3e.png').convert('RGBA');i=i.crop(i.getbbox());i.save('logos/color/3eyes.png');print(i.size)"
          git rm -q .github/workflows/fetch-logo.yml
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -m "Add 3Eyes colour logo" && git push
