name: fetch-assets
on: push
jobs:
  f:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - run: |
          mkdir out && cd out
          B=https://cdn.creativeclaw.co/u/48eaa2c1/images
          curl -sfL -o parliament.jpg $B/9b27b40b-27f1-4ac3-93aa-0360c314c1eb.jpg
          curl -sfL -o town.jpg $B/cd1a29c5-90fd-449c-a118-1056d7d3b3af.jpg
          curl -sfL -o chamber.jpg $B/28ed4160-a98a-42cf-89e9-0331a595517e.jpg
          curl -sfL -o soc.jpg $B/5a629b47-b5d4-4305-8a3f-5b9fdcb34624.jpg
          curl -sfL -o foodbank.jpg $B/84a03a88-85a1-4320-86ee-456939445741.jpg
          curl -sfL -o office.jpg $B/1238f77e-0cbd-40a1-8357-cc49ddaca0b1.jpg
          curl -sfL -o atrium.jpg $B/75a8265d-94d8-48d3-98dc-ce674244701d.jpg
          curl -sfL -o clinic.jpg $B/638c1d1c-95d9-41ed-b81c-42bc9f354e06.jpg
          curl -sfL -o phone.jpg $B/bf8dada2-8428-47c7-b1e4-e2aeaf3ed7b6.jpg
          curl -sfL -o melb.jpg $B/48e2c1c7-f252-48a5-b437-978637f3975b.jpg
          git init -q && git add . && git -c user.name=bot -c user.email=b@b commit -qm a
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:assets-fetch
