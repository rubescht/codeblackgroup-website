name: fetch-assets
on: push
jobs:
  f:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - run: |
          mkdir out && cd out
          B=https://cdn.creativeclaw.co/u/48eaa2c1/images
          curl -sfL -o t1.jpg $B/67b30d09-3cd1-4565-b44d-3866e587ac97.jpg
          curl -sfL -o t2.jpg $B/5009b406-3a80-438a-9eae-2c28b1a9c324.jpg
          curl -sfL -o t3.jpg $B/33bdb66a-b3b4-4b36-bdd6-66d5da1362bd.jpg
          curl -sfL -o t4.jpg $B/73ca52dc-0373-4116-b672-39794e47d8bd.jpg
          git init -q && git add . && git -c user.name=bot -c user.email=b@b commit -qm a
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:assets-fetch
