name: fetch-assets
on: { push: { branches: [main] } }
permissions: { contents: write }
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set -e
          mkdir out && cd out
          B=https://cdn.creativeclaw.co/u/48eaa2c1
          curl -fsSL -o vo1.mp3 $B/audio/756c776f-3f62-417c-8bba-17a0ebeea5c5.mp3
          curl -fsSL -o vo2.mp3 $B/audio/7654b761-63cf-4325-bc8c-4ab7d4fa1241.mp3
          curl -fsSL -o vo3.mp3 $B/audio/164fb2b8-5b33-4f80-bd27-24e8de2b1e93.mp3
          curl -fsSL -o vo4.mp3 $B/audio/741361da-e807-4aaf-8d96-858df3e0ca78.mp3
          curl -fsSL -o vo5.mp3 $B/audio/4072c1f4-9d7b-46ba-b159-2d422d5c0884.mp3
          curl -fsSL -o music.mp3 $B/audio/38ee9e19-72c2-4be7-8f43-2f48098e5bcd.mp3
          curl -fsSL -o k1.jpg $B/images/4d58f367-6138-4c30-915a-2abe385cf4d5.jpg
          curl -fsSL -o k2.jpg $B/images/717d6e2d-e081-4f85-bb31-7d44e464dddd.jpg
          curl -fsSL -o k3.jpg $B/images/53f52d29-971b-446d-b576-ae6bbcfd93fc.jpg
          curl -fsSL -o k4.jpg $B/images/a98f03d4-cfa5-44fe-807e-51ee499844fd.jpg
          curl -fsSL -o k5.jpg $B/images/14e98bce-c1a7-46de-bcd3-3d77398eac3d.jpg
          git init -q && git checkout -q -b assets-fetch && git add . && git -c user.name=bot -c user.email=bot@x commit -qm assets
          git push -f -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" assets-fetch
