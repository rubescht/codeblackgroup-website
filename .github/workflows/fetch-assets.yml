name: fetch-assets
on: { push: { branches: [main] } }
permissions: { contents: write }
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set -e
          mkdir out && cd out
          B=https://cdn.creativeclaw.co/u/48eaa2c1/videos
          curl -fsSL -o c1.mp4 $B/4edb6f44-4e95-4d0a-93c1-124e573dc0a5.mp4
          curl -fsSL -o c2.mp4 $B/776f8fcb-7bf7-449a-97d8-420445d427c9.mp4
          curl -fsSL -o c3.mp4 $B/556c87af-bd8b-46ea-a7de-a9bc9f18b265.mp4
          curl -fsSL -o c4.mp4 $B/5d1fbff7-fb0b-4d85-aaa7-49626e1268c3.mp4
          curl -fsSL -o c5.mp4 $B/f903209b-6cc5-4529-b927-c5df2268f5f4.mp4
          git init -q && git checkout -q -b assets-fetch && git add . && git -c user.name=bot -c user.email=bot@x commit -qm clips
          git push -f -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" assets-fetch
