name: fetch-assets
on: push
jobs:
  f:
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - run: |
          mkdir out && cd out
          curl -fsSL -o vo0b.mp3 https://cdn.creativeclaw.co/u/48eaa2c1/audio/e5ff0dd4-5f38-4f64-aac8-f6fbe573eeb8.mp3
          git init -q && git checkout -q -b assets-fetch && git add . && git -c user.name=bot -c user.email=bot@x commit -qm assets
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" assets-fetch
