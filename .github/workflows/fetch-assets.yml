name: fetch-assets
on: push
jobs:
  f:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - run: |
          mkdir out && cd out
          B=https://cdn.creativeclaw.co/u/48eaa2c1/images
          curl -sfL -o a1.jpg $B/0256055b-091e-4a80-8198-3705e2d2f4c2.jpg
          curl -sfL -o a2.jpg $B/9894c627-0538-4154-bb80-0930d45533ac.jpg
          curl -sfL -o a3.jpg $B/b30a999c-9f5c-4161-9cd9-52348250c1bb.jpg
          curl -sfL -o a4.jpg $B/ebd6113b-3899-4b42-905a-7136d796ef98.jpg
          git init -q && git add . && git -c user.name=bot -c user.email=b@b commit -qm a
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:assets-fetch
