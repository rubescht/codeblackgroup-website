name: fetch-assets
on: push
jobs:
  f:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - run: |
          mkdir out && cd out
          curl -sfL -o land.jpg https://cdn.creativeclaw.co/u/48eaa2c1/images/128dfd1b-cef1-47dd-af2d-d4a953f814b4.jpg
          git init -q && git add . && git -c user.name=bot -c user.email=b@b commit -qm a
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:assets-fetch
