name: fetch-assets
on: push
jobs:
  f:
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - run: |
          mkdir out && cd out
          curl -fsSL -o vo.mp3 https://cdn.creativeclaw.co/u/48eaa2c1/audio/6b5c89d0-51e2-4537-9129-e1ce041136c8.mp3
          curl -fsSL -o music.mp3 https://cdn.creativeclaw.co/u/48eaa2c1/audio/6003c732-c241-40dc-8299-48de759b2a97.mp3
          git init -q && git checkout -q -b assets-fetch && git add . && git -c user.name=bot -c user.email=bot@x commit -qm assets
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" assets-fetch
