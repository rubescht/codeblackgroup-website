name: fetch-assets
on: push
jobs:
  f:
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - run: |
          mkdir out && cd out
          curl -fsSL -o vo.mp3 https://cdn.creativeclaw.co/u/48eaa2c1/audio/3ee81dce-01fc-4b38-8ba2-3acc772b6f4b.mp3
          curl -fsSL -o music.mp3 https://cdn.creativeclaw.co/u/48eaa2c1/audio/4f0b2a25-7ad8-4d1f-a5cb-f8de60c4d019.mp3
          ls -la
          git init -q && git checkout -q -b assets-fetch && git add . && git -c user.name=bot -c user.email=bot@x commit -qm assets
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" assets-fetch
