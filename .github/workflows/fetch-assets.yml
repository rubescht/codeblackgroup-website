name: fetch-assets
on: push
jobs:
  f:
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - run: |
          mkdir out && cd out
          curl -fsSL -o vo0.mp3 https://cdn.creativeclaw.co/u/48eaa2c1/audio/7acf08c6-bbf2-4fca-afd1-45ee0f35c7e5.mp3
          git init -q && git checkout -q -b assets-fetch && git add . && git -c user.name=bot -c user.email=bot@x commit -qm assets
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" assets-fetch
