name: fetch-assets
on:
  push:
    paths: ['.github/workflows/fetch-assets.yml']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Download to a side branch
        run: |
          mkdir out && cd out
          curl -fsSL -o nfp1.jpg https://cdn.creativeclaw.co/u/48eaa2c1/images/fa250c11-3f15-43d7-bd56-d00b8e2a8a9c.jpg
          curl -fsSL -o nfp2.jpg https://cdn.creativeclaw.co/u/48eaa2c1/images/b45a6391-6a28-4ea9-b78d-1d5de945081f.jpg
          curl -fsSL -o corp1.jpg https://cdn.creativeclaw.co/u/48eaa2c1/images/013dc93c-d79e-4e3c-9353-4242fa03ea62.jpg
          curl -fsSL -o corp2.jpg https://cdn.creativeclaw.co/u/48eaa2c1/images/d3da38de-c38b-4019-bc47-0cd4730c49c0.jpg
          git init -q -b assets-fetch
          git config user.name github-actions && git config user.email github-actions@users.noreply.github.com
          git add . && git commit -qm "fetched assets"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" assets-fetch
