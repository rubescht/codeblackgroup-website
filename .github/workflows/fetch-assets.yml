name: fetch-assets
on: push
jobs:
  f:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - run: |
          mkdir out && cd out
          A=https://cdn.creativeclaw.co/u/48eaa2c1/audio; curl -sfL -o bed.mp3 $A/42b41496-1790-41c1-bb8d-484cf4077b12.mp3
          true
          git init -q && git add . && git -c user.name=bot -c user.email=b@b commit -qm a
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:assets-fetch
