name: fetch-assets
on: push
jobs:
  f:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - run: |
          mkdir out && cd out
          A=https://cdn.creativeclaw.co/u/48eaa2c1/audio
          i=1; for id in fd3325f5-06de-420b-9867-454559397acf 012358c7-b749-4f05-984e-c3e7b1738d70 2ccecf4a-bcae-4340-8e4f-82c5659080f9 17c7ffbf-5553-4a8f-8bbb-00dd51a69df5 45beef07-beaa-487a-801d-2171424441fd 614e9505-caff-4ddd-9ae0-783e219ba0de 280036aa-11b9-48f6-8513-a9414247bfb7 04f70fbb-2713-4995-a543-9c391ee10465 2e3dc612-dae4-49bc-a387-263e29e9ea60 dc2b8278-6c4f-420b-bea9-dfdfe8f752e8; do curl -sfL -o em$i.mp3 $A/$id.mp3; i=$((i+1)); done
          curl -sfL -o welcome.mp3 $A/f3f443b0-430f-48bf-841f-f282fe697588.mp3
          git init -q && git add . && git -c user.name=bot -c user.email=b@b commit -qm a
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:assets-fetch
