name: fetch-team-photos
on: { push: { paths: ['.github/workflows/fetch-team.yml'] } }
permissions: { contents: write }
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          pip install -q pillow && mkdir -p img/team
          B=https://cdn.creativeclaw.co/u/48eaa2c1/images
          get(){ curl -fsSL "$B/$1.jpg" -o /tmp/x.jpg && python3 -c "import sys;from PIL import Image;i=Image.open('/tmp/x.jpg').convert('RGB');i.thumbnail((600,900));i.save(sys.argv[1],quality=85)" "img/team/$2.jpg" && sed -i "s#$B/$1.jpg#img/team/$2.jpg#" index.html; }
          get fddc7780-a850-4131-b512-2258ce7d279b rick-scarra
          git rm -q .github/workflows/fetch-team.yml
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -m "Self-host Rick Scarra headshot" && git push
